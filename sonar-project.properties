sonar.host.url=https://sonarcloud.io
sonar.organization=jorgelopez04
sonar.projectKey=jorgelopez04_FrontendValidacion
sonar.projectName=FrontendValidacion

# Rutas de Cobertura (Asegúrate de que coincida con la carpeta que genera Angular)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.projectBaseDir=.
sonar.sources=src/app
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Exclusiones para optimizar el análisis
sonar.exclusions=src/app/guards/**, \
                 src/app/interceptors/**, \
                 src/app/services/**, \
                 src/app/core/models/**, \
                 src/app/app.config.ts, \
                 src/app/app.routes.ts, \
                 src/main.ts, \
                 src/test.ts, \
                 **/*.module.ts, \
                 **/*.model.ts, \
                 **/*.interface.ts, \
                 **/*.html, \
                 **/*.scss, \
                 src/environments/**