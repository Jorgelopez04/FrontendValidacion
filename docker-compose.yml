version: '3.8'

services:
  # Base de Datos (Clave para RNF11 y RNF6)
  db:
    image: postgres:15-alpine
    container_name: tailorflow-db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password_segura
      POSTGRES_DB: tailorflow_db
    ports:
      - "5432:5432"
    volumes:
      - tailorflow_data:/var/lib/postgresql/data

  # Backend (NestJS)
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: tailorflow-backend
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: user_admin
      DATABASE_PASSWORD: password_segura
      DATABASE_NAME: tailorflow_db
    depends_on:
      - db
    ports:
      - "3000:3000"

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tailorflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
    name: tailorflow-network

volumes:
  tailorflow_data: